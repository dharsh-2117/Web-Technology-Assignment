<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="form-card">

            <h1>Student Admission</h1>
            <p class="subtitle">Create your registration account</p>

            <form id="registrationForm">

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                    <small class="error" id="nameError"></small>
                </div>

                <!-- Roll Number -->
                <div class="form-group">
                    <label for="roll">Roll Number</label>
                    <input type="text" id="roll" placeholder="Enter roll number">
                    <small class="error" id="rollError"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <small class="error" id="emailError"></small>
                </div>

                <!-- Course -->
                <select id="course">
    <option value="">-- Select Course --</option>
    <option value="BE">B.E</option>
    <option value="BCA">BCA</option>
    <option value="BSc CS">B.Sc Computer Science</option>
    <option value="BTech">B.Tech</option>
    <option value="MCA">MCA</option>
</select>
                    <small class="error" id="courseError"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                    <small class="error" id="passwordError"></small>
                </div>

                <!-- File Upload -->
                <div class="form-group">
                    <label for="document">Upload Document</label>
                    <input type="file" id="document">
                    <small class="error" id="fileError"></small>
                </div>

                <button type="submit">Register Now</button>

                <p id="successMessage"></p>

            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
